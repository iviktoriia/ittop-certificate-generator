<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Генератор сертификатов</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="admin-panel">
    <div class="admin-title">📜 Генератор сертификатов</div>
    <div class="double-lists">
        <div class="list-card">
            <h3>🎓 Программа «МКА5»</h3>
            <textarea id="listMka5" rows="5" placeholder="Введите имена (каждое с новой строки)"></textarea>
        </div>
        <div class="list-card">
            <h3>🎓 Программа «МКА3»</h3>
            <textarea id="listMka3" rows="5" placeholder="Введите имена (каждое с новой строки)"></textarea>
        </div>
        <div class="list-card">
            <h3>🌟 Программа «Первый Шаг»</h3>
            <textarea id="listFirstStep" rows="5" placeholder="Введите имена (каждое с новой строки)"></textarea>
        </div>
    </div>

    <div class="action-bar">
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="generateBtn">✨ Создать сертификаты</button>
            <button class="btn btn-outline" id="sampleBtn">📋 Пример имён</button>
            <button class="btn btn-outline" id="clearAllBtn">🗑 Очистить всё</button>
            <button class="btn btn-outline" id="pdfDownloadBtn">📥 Скачать PDF</button>
            <button class="btn btn-outline" id="pngDownloadBtn">📥 PNG (ZIP)</button>
        </div>
        <div class="counter" id="counterDisplay">Сертификатов: 0</div>
    </div>
</div>

<div id="certificatesContainer" class="certificates-container">
    <div class="empty-message">Заполните списки имён и нажмите «Создать сертификаты»</div>
</div>

<script src="script.js"></script>
</body>
</html>
